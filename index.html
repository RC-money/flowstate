<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flowstate</title>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="/src/index.css" />
    <style>
      body {
        background: radial-gradient(circle at 30% 20%, rgba(91,92,240,0.15), #0E1625 70%);
        color: #E5E7EB;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        font-family: ui-sans-serif, system-ui, "Inter", sans-serif;
      }
      .loading-orb {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: linear-gradient(135deg, #5b5cf0, #a5afff);
        box-shadow: 0 0 24px rgba(124,131,255,0.4);
        animation: float 6s ease-in-out infinite;
      }
      @keyframes float {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-orb"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
